# 经验参考配置：预算、页深和关键词数不是平台安全界限。
# reference 模式到线仅提示；enforce 模式才执行用户明确选择的限制。
# 当前在线访问关闭，账号冻结由本地 access-policy.json 单独控制。
platforms:
- boss
cities:
- name: 杭州
  boss_code: '101210100'
keywords:
- AI Agent
pages_per_query: 1
detail_limit_per_query: 3
page_size: 30
collect_details: true
request_delay_seconds:
- 6
- 12
filters:
- {}
exclude_title_keywords:
- 销售
- 主播
exclude_company_keywords:
- 猎头
- 劳务派遣
database_path: data/smoke.sqlite3
raw_dir: data/raw
output_dir: output
browser:
  mode: persistent
  cdp_url: http://127.0.0.1:9222
  headless: false
  navigation_timeout_ms: 30000
auto_chat:
  enabled: false
  dry_run: true
network_enabled: false
budget_mode: reference
max_page_number: 10
max_keywords_per_run: 3
