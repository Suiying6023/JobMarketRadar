# 经验参考配置：预算、页深和关键词数不是平台安全界限。
# reference 模式到线仅提示；enforce 模式才执行用户明确选择的限制。
# 当前在线访问关闭，账号冻结由本地 access-policy.json 单独控制。
platforms:
- boss
cities:
- name: 杭州
  boss_code: '101210100'
- name: 深圳
  boss_code: '101280600'
- name: 上海
  boss_code: '101020100'
keywords:
- AI Agent
- 大模型应用开发
- AI应用工程师
pages_per_query: 1
detail_limit_per_query: 5
page_size: 30
collect_details: true
request_delay_seconds:
- 6
- 12
filters:
- {}
exclude_title_keywords:
- 销售
- 主播
- 培训讲师
exclude_company_keywords:
- 猎头
- 劳务派遣
database_path: data/jobs.sqlite3
raw_dir: data/raw
output_dir: output
browser:
  mode: persistent
  cdp_url: http://127.0.0.1:9222
  user_data_dir: .browser-profile
  channel: chrome
  headless: false
  navigation_timeout_ms: 30000
  slow_mo_ms: 0
auto_chat:
  enabled: false
  dry_run: true
  require_manual_confirm: true
  max_actions_per_run: 5
  greeting: 您好，我对这个岗位感兴趣，方便进一步沟通吗？
  min_delay_seconds: 8
  max_delay_seconds: 15
network_enabled: false
max_page_number: 10
max_keywords_per_run: 3
