# 经验参考配置：预算、页深和关键词数不是平台安全界限。
# reference 模式到线仅提示；enforce 模式才执行用户明确选择的限制。
# 当前在线访问关闭，账号冻结由本地 access-policy.json 单独控制。
platforms:
- boss
cities:
- name: 杭州
  boss_code: '101210100'
keywords:
- AI Agent
- 智能体开发
- Agent应用开发
- AI应用开发
- AI算法工程师
- AI全栈工程师
- AI后端工程师
- langgraph
- opencode
- python
- RAG
- 向量数据库
- PyTorch
pages_per_query: 5
detail_limit_per_query: 150
page_size: 30
collect_details: true
request_delay_seconds:
- 6
- 12
detail_delay_seconds:
- 4
- 6
detail_batch: 5
detail_cooldown_seconds:
- 90
- 150
burst_threshold: 8
burst_penalty_seconds:
- 60
- 120
filters:
- jobType: 全职
  degree: 初中及以下,中专/中技,高中,大专,本科
  experience: 应届生,经验不限,1年以内,1-3年
exclude_title_keywords:
- 销售
- 主播
- 客服
- 电话
- 实习
- 外包
- 外派
- 驻场
- AIGC
exclude_company_keywords:
- 猎头
- 劳务派遣
- 外企德科
- 万宝盛华
- 软通动力
- 博彦科技
- 易宝软件
- 紫光云数
- 中软国际
- 文思海辉
- 中电金信
- 法本信息
- 东软
- 凯捷
- 勇冠睿智
database_path: data/hangzhou_agent.sqlite3
raw_dir: data/raw
output_dir: output
browser:
  mode: persistent
  user_data_dir: .browser-profile
  channel: chrome
  cdp_url: http://127.0.0.1:9222
  headless: false
  navigation_timeout_ms: 30000
auto_chat:
  enabled: false
  dry_run: true
  require_manual_confirm: true
network_enabled: false
max_page_number: 10
max_keywords_per_run: 3
