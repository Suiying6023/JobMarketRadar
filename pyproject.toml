[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-radar"
version = "0.3.0"
description = "通用岗位采集、存储、任务运行与配置管理服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # patchright 是 playwright 的反检测分支，collectors/boss.py 直接 import 它。
  # 缺它 CLI 会在 import 阶段就崩（ModuleNotFoundError），2026-08-26 重建环境时暴露。
  "patchright>=1.50",
  "playwright>=1.50",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
job-radar = "job_radar.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_radar = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# 默认只跑端到端套件。
#
# 旧的 31 个文件、332 个用例绝大多数是「手写 FakePage 返回 dict」的单元测试：
# 它们验证的是"传进去的 dict 能被解析"，没有验证请求是怎么发出去的。真实漂移
# 就是这么来的——生产代码加了 page.on()，替身没跟上，60 个用例一起红，而因为
# 套件跑一次要 35 秒、又长期没人跑，红灯一直亮着。
#
# 现在默认只跑 tests/e2e：真的起一个本地 HTTP 服务，真的发请求，走完整链路。
# `test_pipeline_e2e.py` 覆盖采集链路，`test_refresh_e2e.py` 覆盖刷新链路
# （取值 → 解析 → 判定 → 选目标 → 落库），刷新那套是本轮新写的：
# 之前刷新只有"把字典喂给 classify"的单元测试，所以"不落库 / 不续跑 /
# 自愈永远失败"三个 bug 一直藏着。历史用例原样保留在 tests/_legacy/，需要时用
#   python -m pytest tests/_legacy
# 显式调出来查证历史行为，不进入默认门禁。
#
# tests/scrape 是独立抓取层（src/boss_scrape）的门禁：纯逻辑，不碰浏览器、不联网，
# 秒级跑完（classify 判据 + Python 侧 HTML 取值 + 运行日志）。
# tests/analysis 是分析层（src/job_analysis）的门禁：决策模型的重试语义、
# 并发隔离、标签摊平，同样不联网。
testpaths = ["tests/e2e", "tests/scrape", "tests/analysis"]
addopts = "-ra"
