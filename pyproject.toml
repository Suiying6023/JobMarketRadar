[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-radar"
version = "0.3.0"
description = "通用岗位采集、存储、任务运行与配置管理服务"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  # patchright 是 playwright 的反检测分支，collectors/boss.py 直接 import 它。
  # 缺它 CLI 会在 import 阶段就崩（ModuleNotFoundError），2026-08-26 重建环境时暴露。
  "patchright>=1.50",
  "playwright>=1.50",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
job-radar = "job_radar.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_radar = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
# 默认门禁 = **只有端到端**。
#
# 旧套件（31 个文件 / 320 个用例）绝大多数是「手写 FakePage 返回 dict」的单元
# 测试：验证的是"传进去的 dict 能被解析"，没验证请求是怎么发出去的。真实漂移
# 就是这么来的 —— 生产代码加了 `page.on()`，替身没跟上，60 个用例一起红；而
# 套件跑一次 35 秒、又长期没人跑，红灯就一直亮着。
#
# 所以默认只跑 tests/e2e：真的起本地 HTTP 服务、真的发请求、走完整链路。
#   test_pipeline_e2e.py   采集链路
#   test_refresh_e2e.py    刷新链路（取值 → 解析 → 判定 → 选目标 → 落库）
#   test_session_offline.py 采集会话三阶段（离线，mock 掉 collector）
#   test_keyword_rotation.py 关键词轮转
#
# 三档，按需显式跑：
#   pytest                       → 只有 e2e（约 22 秒）
#   pytest tests/scrape tests/analysis   → 纯逻辑门禁（不联网，秒级）
#   pytest tests/_legacy         → 历史行为查证，红着不代表现在有问题
#
# 2026-10-19 从三个目录收回成只有 e2e：注释一直写着"默认只跑 e2e"，但
# `testpaths` 被陆续扩成了三个目录，实际每次要跑 128 个用例。
#
# 注意 `src/job_analysis` 是**独立分析包**（`python -m job_analysis.relabel` 入口），
# 不被 `job_radar` 导入，但 `tests/analysis` 覆盖它 —— 所以那批测试按需跑，
# 不能当成"已删模块的历史测试"一起清掉。
testpaths = ["tests/e2e"]
addopts = "-ra"
